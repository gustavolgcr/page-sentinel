<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store screenshot</title>
<style>
  @font-face { font-family: 'Orbitron'; src: url('../fonts/Orbitron.woff2') format('woff2'); font-weight: 400 900; }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1280px; height: 800px; overflow: hidden; position: relative;
    background: radial-gradient(90% 60% at 50% 100%, rgba(0,120,160,.35), transparent 70%), #02040a;
    color: #bdf6ff; font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  }
  .grid {
    position: absolute; left: -40%; right: -40%; bottom: -35%; height: 75%;
    background-image: linear-gradient(rgba(77,243,255,.3) 1px, transparent 1px), linear-gradient(90deg, rgba(77,243,255,.3) 1px, transparent 1px);
    background-size: 60px 60px; transform: perspective(420px) rotateX(62deg); transform-origin: 50% 0;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 45%);
  }
  .horizon { position: absolute; left: 0; right: 0; top: 49%; height: 2px; background: #4df3ff; box-shadow: 0 0 18px 4px rgba(77,243,255,.6); opacity: .7; }
  .copy { position: absolute; left: 90px; top: 150px; width: 560px; }
  .logo { display: flex; align-items: center; gap: 18px; margin-bottom: 34px; }
  .logo img { width: 64px; height: 64px; }
  .logo span { font: 800 26px Orbitron; letter-spacing: .16em; color: #c8fdff; text-shadow: 0 0 6px #4df3ff, 0 0 20px rgba(77,243,255,.7); }
  h1 { font: 700 44px/1.18 Orbitron; color: #fff; letter-spacing: .02em; text-shadow: 0 0 18px rgba(77,243,255,.45); }
  h1 em { font-style: normal; color: #ff6a1a; text-shadow: 0 0 14px rgba(255,106,26,.7); }
  ul { list-style: none; padding: 0; margin-top: 34px; font-size: 19px; line-height: 1.9; }
  li::before { content: '▸ '; color: #4df3ff; }
  .shot {
    position: absolute; right: 110px; top: 50px; width: 400px; height: 720px;
    border: 1px solid #4df3ff; box-shadow: 0 0 10px rgba(77,243,255,.7), 0 0 60px rgba(77,243,255,.25);
    background: url('popup-store.png') top / 400px auto no-repeat;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="horizon"></div>
  <div class="copy">
    <div class="logo"><img src="../icons/icon128.png" alt=""><span>PAGE SENTINEL</span></div>
    <h1>A page changed?<br>You hear it <em>instantly</em>.</h1>
    <ul>
      <li>Pick a site and an interval</li>
      <li>Checks without opening tabs</li>
      <li>Retro synth alert and notification</li>
      <li>Shows what was added and removed</li>
      <li>Free, no account, no server</li>
    </ul>
  </div>
  <div class="shot"></div>
</body>
</html>
