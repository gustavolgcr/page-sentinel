<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Promo tile</title>
<style>
  @font-face { font-family: 'Orbitron'; src: url('../fonts/Orbitron.woff2') format('woff2'); font-weight: 400 900; }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 440px; height: 280px; overflow: hidden; position: relative;
    background: radial-gradient(100% 70% at 50% 100%, rgba(0,120,160,.4), transparent 70%), #02040a;
  }
  .grid {
    position: absolute; left: -60%; right: -60%; bottom: -45%; height: 80%;
    background-image: linear-gradient(rgba(77,243,255,.32) 1px, transparent 1px), linear-gradient(90deg, rgba(77,243,255,.32) 1px, transparent 1px);
    background-size: 30px 30px; transform: perspective(200px) rotateX(62deg); transform-origin: 50% 0;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 45%);
  }
  .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 34px; }
  img { width: 92px; height: 92px; filter: drop-shadow(0 0 12px rgba(77,243,255,.6)); }
  h1 { margin-top: 18px; font: 800 26px Orbitron; letter-spacing: .14em; color: #c8fdff; text-shadow: 0 0 6px #4df3ff, 0 0 20px rgba(77,243,255,.7); }
  p { margin-top: 10px; font: 600 11px Orbitron; letter-spacing: .2em; color: #ff8a4a; text-shadow: 0 0 8px rgba(255,106,26,.6); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="content">
    <img src="../icons/icon128.png" alt="">
    <h1>PAGE SENTINEL</h1>
    <p>It changed? You hear it.</p>
  </div>
</body>
</html>
