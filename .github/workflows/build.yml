name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate extension
        run: node scripts/validate.mjs

      - name: Build Chrome Web Store package
        run: ./scripts/build-zip.sh

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: page-sentinel
          path: dist/*.zip
